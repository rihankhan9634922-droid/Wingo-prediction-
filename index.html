<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daman Live Prediction</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; padding: 15px; }
    .app-container { width: 100%; max-width: 480px; background: #1e293b; border-radius: 16px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .header { text-align: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px; }
    .header h1 { font-size: 20px; color: #38bdf8; }
    .card { background: #0f172a; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #334155; text-align: center; }
    .timer-display { font-size: 36px; font-weight: bold; color: #4ade80; margin: 5px 0; }
    .period-id { font-size: 15px; color: #94a3b8; font-weight: bold; }
    .bots-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
    .bot-card { background: #334155; padding: 12px 15px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
    .pred-badge { font-weight: bold; padding: 6px 12px; border-radius: 6px; font-size: 14px; }
    .pred-BIG { background: #fbbf24; color: #0f172a; }
    .pred-SMALL { background: #a855f7; color: #fff; }
    .status-bar { font-size: 12px; color: #38bdf8; margin-top: 10px; text-align: center; font-weight: 500; }
    .history-box { background: #0f172a; border-radius: 10px; padding: 10px; font-size: 12px; color: #cbd5e1; max-height: 120px; overflow-y: auto; }
    .history-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1e293b; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h1>DAMAN WINGO 30-SEC LIVE</h1>
  </div>

  <div class="card">
    <div class="period-id">PERIOD: <span id="period" style="color: #38bdf8;">Loading...</span></div>
    <div style="font-size: 13px; color: #94a3b8; margin-top: 5px;">TIME LEFT</div>
    <div class="timer-display" id="timer">00:30</div>
  </div>

  <div style="font-size: 15px; margin-bottom: 10px; color: #cbd5e1; font-weight: bold;">Bot Predictions</div>
  <div class="bots-list" id="botsContainer"></div>

  <div style="font-size: 15px; margin-bottom: 10px; color: #cbd5e1; font-weight: bold;">Game History</div>
  <div class="history-box" id="historyContainer">Connecting...</div>

  <div class="status-bar" id="apiStatus">Connecting to Server...</div>
</div>

<script>
  const API_URL = "https://api.wingobot.com/v2/30-sec-game-history";
  const TOKEN = "ws_64febebc8e74a5154ebb1d72a30ea4397265d56772b0ec5119b160d7286b0182";
  const bots = ["Sophia", "Daniel", "Emma", "Ryan", "Olivia"];

  async function fetchLiveDamanData() {
    try {
      const response = await fetch(API_URL, {
        headers: { "Authorization": `Bearer ${TOKEN}` }
      });
      const data = await response.json();

      if (data.success) {
        document.getElementById('period').innerText = data.current.issueNumber;
        document.getElementById('apiStatus').innerText = `Updated: ${data.stats.last_updated}`;
        document.getElementById('apiStatus').style.color = "#4ade80";

        // History Render
        let historyHTML = '';
        data.history.slice(0, 5).forEach(row => {
          historyHTML += `
            <div class="history-row">
              <span>${row.issueNumber}</span>
              <span>Num: ${row.number}</span>
              <span style="color: ${row.colour === 'green' ? '#4ade80' : '#ef4444'}">${row.colour.toUpperCase()}</span>
            </div>
          `;
        });
        document.getElementById('historyContainer').innerHTML = historyHTML;
      } else {
        document.getElementById('apiStatus').innerText = "API Error: " + data.error;
      }
    } catch (error) {
      document.getElementById('apiStatus').innerText = "CORS / Network Error: API server Access restrict hai";
      document.getElementById('apiStatus').style.color = "#ef4444";
    }
  }

  // Timer simulation for 30s Wingo
  let seconds = 30;
  setInterval(() => {
    seconds--;
    if (seconds <= 0) {
      seconds = 30;
      fetchLiveDamanData();
      generatePredictions();
    }
    let s = seconds.toString().padStart(2, '0');
    document.getElementById('timer').innerText = `00:${s}`;
  }, 1000);

  function generatePredictions() {
    const container = document.getElementById('botsContainer');
    container.innerHTML = '';
    bots.forEach(bot => {
      const pred = Math.random() > 0.5 ? 'BIG' : 'SMALL';
      container.innerHTML += `
        <div class="bot-card">
          <div style="font-weight: bold; color: #fff;">${bot} Bot</div>
          <div class="pred-badge pred-${pred}">${pred}</div>
        </div>
      `;
    });
  }

  generatePredictions();
  fetchLiveDamanData();
</script>

</body>
</html>
