<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Daman Prediction AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#080d1a;
  color:#fff;
  max-width:600px;
  margin:auto;
  padding:10px;
}

/* TOP */
.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #1e293b;
  margin-bottom:12px;
}

.logo{
  color:#ffb703;
  font-size:16px;
  font-weight:bold;
}

.login{
  background:#ff2a55;
  padding:7px 14px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

/* TABS */
.game-tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  background:#fff;
  padding:6px;
  border-radius:14px;
  margin-bottom:12px;
}

.tab{
  background:#f1f5f9;
  color:#64748b;
  padding:9px 2px;
  border-radius:10px;
  text-align:center;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.tab.active{
  background:#ff4d4d;
  color:#fff;
}

.tab.disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* BANNER */
.banner{
  background:#e63946;
  border-radius:16px;
  padding:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.game-name{
  font-size:14px;
  font-weight:bold;
  margin-bottom:7px;
}

.balls{
  display:flex;
  gap:4px;
}

.ball{
  width:23px;
  height:23px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:bold;
}

.ball-red{
  background:#ff4d4d;
}

.ball-green{
  background:#2ec4b6;
}

.timer{
  text-align:right;
}

.timer-title{
  font-size:10px;
  opacity:.8;
}

.timer-boxes{
  display:flex;
  gap:3px;
  align-items:center;
  font-size:18px;
  font-weight:900;
}

.t-box{
  background:#fff;
  color:#000;
  padding:3px 5px;
  border-radius:4px;
}

.period-id{
  font-size:10px;
  font-weight:bold;
  margin-top:6px;
  max-width:190px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.api-error{
  color:#ffe0e0;
  font-size:9px;
  margin-top:3px;
}

/* CARD */
.card{
  background:#131b2e;
  border:1px solid #1e293b;
  border-radius:16px;
  padding:12px;
  margin-bottom:15px;
}

.section-title{
  color:#ffb703;
  font-size:14px;
  font-weight:bold;
  margin-bottom:10px;
}

/* BOTS */
.bot-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.bot-card{
  background:#1a243a;
  border:1px solid #26334d;
  border-radius:12px;
  padding:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  cursor:pointer;
}

.bot-left{
  display:flex;
  align-items:center;
  gap:9px;
}

.rank{
  width:21px;
  height:21px;
  border-radius:50%;
  background:#2b374e;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:bold;
}

.rank1{
  background:#ffb703;
  color:#000;
}

.rank2{
  background:#cbd5e1;
  color:#000;
}

.rank3{
  background:#b45309;
}

.bot-avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #ffb703;
}

.bot-name{
  font-size:13px;
  font-weight:bold;
}

.bot-acc{
  color:#2ec4b6;
  font-size:13px;
  font-weight:bold;
  margin-left:6px;
}

.history-dots{
  display:flex;
  gap:3px;
  margin-top:4px;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:7px;
}

.dot-win{
  background:#2ec4b6;
  color:#000;
}

.dot-loss{
  background:#e63946;
  color:#fff;
}

.pred{
  padding:5px 10px;
  border-radius:6px;
  font-size:12px;
  font-weight:900;
}

.pred-big{
  background:#ff9f1c;
  color:#000;
}

.pred-small{
  background:#2ec4b6;
  color:#000;
}

/* DETAIL */
#botDetailPage{
  display:none;
}

.back-btn{
  background:#2b374e;
  color:#ffb703;
  border:none;
  padding:8px 14px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:15px;
}

.profile{
  display:flex;
  align-items:center;
  gap:12px;
}

.profile-avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  border:2px solid #ffb703;
  object-fit:cover;
}

.profile-name{
  font-size:16px;
  font-weight:bold;
}

.profile-acc{
  color:#2ec4b6;
  font-size:15px;
  margin-left:6px;
  font-weight:bold;
}

/* NEXT */
.next-bet{
  background:linear-gradient(135deg,#1e293b,#0f172a);
  border:2px solid #ffb703;
  border-radius:13px;
  padding:15px;
  text-align:center;
  margin:17px 0;
}

.next-title{
  font-size:11px;
  color:#94a3b8;
  font-weight:bold;
}

.next-period{
  color:#ffb703;
  font-size:13px;
  font-weight:bold;
  margin:6px 0 10px;
}

.next-badge{
  display:inline-block;
  padding:8px 30px;
  border-radius:8px;
  font-size:23px;
  font-weight:900;
}

/* TABLE */
.history-title{
  font-size:13px;
  font-weight:bold;
  margin-bottom:8px;
}

.bets-table{
  width:100%;
  border-collapse:collapse;
  font-size:10px;
}

.bets-table th{
  color:#64748b;
  text-align:left;
  padding:7px 2px;
}

.bets-table td{
  padding:8px 2px;
  border-top:1px solid #1e293b;
}

.badge-big{
  background:#ff9f1c;
  color:#000;
  padding:3px 6px;
  border-radius:4px;
  font-weight:bold;
}

.badge-small{
  background:#2ec4b6;
  color:#000;
  padding:3px 6px;
  border-radius:4px;
  font-weight:bold;
}

.win-text{
  color:#2ec4b6;
  font-weight:bold;
}

.loss-text{
  color:#e63946;
  font-weight:bold;
}
</style>
</head>

<body>

<!-- MAIN PAGE -->
<div id="mainPage">

  <div class="top-bar">
    <div class="logo">👑 DAMAN PREDICTION</div>
    <div class="login">Login</div>
  </div>

  <div class="game-tabs">

    <div class="tab active"
         id="tab30s"
         onclick="switchGameMode('30s')">
      ⏱️<br>WinGo 30s
    </div>

    <div class="tab"
         id="tab1m"
         onclick="switchGameMode('1m')">
      ⏱️<br>WinGo 1m
    </div>

    <div class="tab disabled">
      🔒<br>WinGo 3m
    </div>

    <div class="tab disabled">
      🔒<br>WinGo 5m
    </div>

  </div>

  <div class="banner">

    <div>
      <div class="game-name" id="bannerGameTitle">
        WinGo 30sec
      </div>

      <div class="balls" id="recentBalls"></div>
    </div>

    <div class="timer">

      <div class="timer-title">
        Time remaining
      </div>

      <div class="timer-boxes">
        <span class="t-box">0</span>
        <span class="t-box">0</span>
        :
        <span class="t-box" id="t1">0</span>
        <span class="t-box" id="t2">0</span>
      </div>

      <div class="period-id" id="periodId">
        Loading...
      </div>

      <div class="api-error" id="apiError"></div>

    </div>

  </div>


  <!-- BOT LIST -->
  <div class="card" id="botListPage">

    <div class="section-title">
      🏆 Select Bot to Open Prediction Page
    </div>

    <div class="bot-list" id="botListContainer"></div>

  </div>

</div>


<!-- BOT DETAIL ONLY -->
<div class="card" id="botDetailPage">

  <button class="back-btn" onclick="showListPage()">
    ← Back to All Bots
  </button>

  <div class="profile">

    <img id="activeBotAvatar"
         class="profile-avatar"
         src="">

    <div>

      <span id="activeBotName"
            class="profile-name">
      </span>

      <span id="activeBotAcc"
            class="profile-acc">
      </span>

    </div>

  </div>


  <div class="next-bet">

    <div class="next-title">
      NEXT PERIOD PREDICTION
    </div>

    <div class="next-period"
         id="detailPeriodNum">
      Period: Loading...
    </div>

    <div id="detailPredBadge"></div>

  </div>


  <div class="history-title">
    Last 10 Bets History
  </div>

  <table class="bets-table">

    <thead>
      <tr>
        <th>Period</th>
        <th>Prediction</th>
        <th>Result</th>
        <th>Status</th>
      </tr>
    </thead>

    <tbody id="betsHistoryTable"></tbody>

  </table>

</div>


<script>

/* ==========================================
   API TOKEN
   ==========================================

   IMPORTANT:
   Yahan apna API token paste karein.

   Example:
   const API_TOKEN = "YOUR_TOKEN";

   Public GitHub par token visible ho sakta hai.
========================================== */

const API_TOKEN = "PASTE_YOUR_TOKEN_HERE";


/* ==========================================
   API URLS
========================================== */

const API_URL = {

  "30s":
  "https://api.wingobot.com/v2/30-sec-game-history",

  /*
    1-minute ka exact API endpoint aapke
    diye hue code me nahi tha.

    Isliye yahan fake period calculation
    nahi ki gayi hai.
  */

  "1m":
  "https://api.wingobot.com/v2/1-min-game-history"

};


/* ==========================================
   GAME STATE
========================================== */

let currentGameMode = "30s";

let activeBotId = null;

let currentServerPeriod = "";

let serverHistory = [];

let lastServerPeriod = {

  "30s":"",
  "1m":""

};


/* ==========================================
   BOT CREATOR
========================================== */

function createBots(){

  return [

    {
      id:1,
      name:"Sophia",
      avatar:"https://randomuser.me/api/portraits/women/44.jpg",
      history:[],
      nextPred:"BIG"
    },

    {
      id:2,
      name:"Daniel",
      avatar:"https://randomuser.me/api/portraits/men/32.jpg",
      history:[],
      nextPred:"SMALL"
    },

    {
      id:3,
      name:"Emma",
      avatar:"https://randomuser.me/api/portraits/women/68.jpg",
      history:[],
      nextPred:"BIG"
    },

    {
      id:4,
      name:"Ryan",
      avatar:"https://randomuser.me/api/portraits/men/46.jpg",
      history:[],
      nextPred:"SMALL"
    },

    {
      id:5,
      name:"Olivia",
      avatar:"https://randomuser.me/api/portraits/women/65.jpg",
      history:[],
      nextPred:"BIG"
    },

    {
      id:6,
      name:"Liam",
      avatar:"https://randomuser.me/api/portraits/men/22.jpg",
      history:[],
      nextPred:"SMALL"
    },

    {
      id:7,
      name:"Ava",
      avatar:"https://randomuser.me/api/portraits/women/26.jpg",
      history:[],
      nextPred:"BIG"
    },

    {
      id:8,
      name:"Noah",
      avatar:"https://randomuser.me/api/portraits/men/85.jpg",
      history:[],
      nextPred:"SMALL"
    },

    {
      id:9,
      name:"Mia",
      avatar:"https://randomuser.me/api/portraits/women/12.jpg",
      history:[],
      nextPred:"BIG"
    },

    {
      id:10,
      name:"James",
      avatar:"https://randomuser.me/api/portraits/men/11.jpg",
      history:[],
      nextPred:"SMALL"
    }

  ];

}


let botData = {

  "30s":createBots(),

  "1m":createBots()

};


/* ==========================================
   STORAGE
========================================== */

function storageKey(){

  return "daman_period_" + currentGameMode;

}


function savePeriod(period){

  if(!period) return;

  localStorage.setItem(
    storageKey(),
    String(period)
  );

}


function getSavedPeriod(){

  return localStorage.getItem(
    storageKey()
  ) || "";

}


/* ==========================================
   PERIOD COMPARISON
========================================== */

function periodIsNotOlder(newPeriod,oldPeriod){

  if(!oldPeriod) return true;

  try{

    return BigInt(newPeriod) >= BigInt(oldPeriod);

  }catch(e){

    return newPeriod !== oldPeriod;

  }

}


/* ==========================================
   PREDICTION
========================================== */

function randomPrediction(){

  return Math.random() >= .5
    ? "BIG"
    : "SMALL";

}


/* ==========================================
   ACCURACY
========================================== */

function getAccuracy(bot){

  if(!bot.history.length)
    return 0;

  const finished =
    bot.history.filter(
      x => x.result !== "Waiting"
    );

  if(!finished.length)
    return 0;

  const wins =
    finished.filter(
      x => x.status === "WIN"
    ).length;

  return Math.round(
    wins / finished.length * 100
  );

}


/* ==========================================
   FETCH API
========================================== */

async function fetchGameData(){

  const url = API_URL[currentGameMode];

  if(!url) return;

  try{

    document.getElementById("apiError")
      .innerText = "";

    const response = await fetch(
      url,
      {
        method:"GET",

        headers:{
          "Authorization":
            "Bearer " + API_TOKEN,

          "Accept":
            "application/json"
        },

        cache:"no-store"
      }
    );


    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    if(!data.success){

      throw new Error(
        data.error || "API Error"
      );

    }


    if(
      !data.current ||
      !data.current.issueNumber
    ){

      throw new Error(
        "Current period not found"
      );

    }


    const apiPeriod =
      String(
        data.current.issueNumber
      );


    const savedPeriod =
      getSavedPeriod();


    /*
      API period ko piche jane nahi dena.
    */

    if(
      !savedPeriod ||
      periodIsNotOlder(
        apiPeriod,
        savedPeriod
      )
    ){

      currentServerPeriod =
        apiPeriod;

      savePeriod(
        apiPeriod
      );

    }else{

      currentServerPeriod =
        savedPeriod;

    }


    serverHistory =
      Array.isArray(data.history)
      ? data.history
      : [];


    renderServerData();

    processNewPeriod();

  }catch(error){

    console.log(
      "API ERROR:",
      error
    );


    const saved =
      getSavedPeriod();


    if(saved){

      currentServerPeriod =
        saved;

      renderServerData();

    }


    document.getElementById("apiError")
      .innerText =
        "Server unavailable";

  }

}


/* ==========================================
   SERVER DISPLAY
========================================== */

function renderServerData(){

  document.getElementById("periodId")
    .innerText =
      currentServerPeriod ||
      "Loading...";


  document.getElementById("detailPeriodNum")
    .innerText =
      "Period: " +
      (
        currentServerPeriod ||
        "Loading..."
      );


  renderRecentBalls();

}


/* ==========================================
   RECENT RESULTS
========================================== */

function renderRecentBalls(){

  const container =
    document.getElementById(
      "recentBalls"
    );

  container.innerHTML = "";


  serverHistory
    .slice(0,5)
    .reverse()
    .forEach(row=>{

      const number =
        Number(row.number);


      const ball =
        document.createElement(
          "div"
        );


      ball.className =
        "ball " +
        (
          number >= 5
          ? "ball-green"
          : "ball-red"
        );


      ball.innerText =
        Number.isNaN(number)
        ? "?"
        : number;


      container.appendChild(
        ball
      );

    });

}


/* ==========================================
   PROCESS NEW PERIOD
========================================== */

function processNewPeriod(){

  if(!currentServerPeriod)
    return;


  const oldPeriod =
    lastServerPeriod[
      currentGameMode
    ];


  /*
    Same period ko dobara process nahi karna.
  */

  if(oldPeriod === currentServerPeriod){

    renderBotList();

    if(activeBotId)
      renderActiveBotPage();

    return;

  }


  lastServerPeriod[
    currentGameMode
  ] =
    currentServerPeriod;


  const latest =
    serverHistory[0];


  /*
    First load par old API history ko
    bot history me fill karna.
  */

  if(
    latest &&
    botData[currentGameMode][0].history.length === 0
  ){

    initializeBotHistory();

  }


  renderBotList();


  if(activeBotId)
    renderActiveBotPage();

}


/* ==========================================
   INITIAL HISTORY
========================================== */

function initializeBotHistory(){

  const history =
    serverHistory
      .slice(0,10);


  botData[currentGameMode]
    .forEach(bot=>{

      bot.history = [];


      history.forEach(row=>{

        const number =
          Number(row.number);


        if(
          Number.isNaN(number)
        ) return;


        const actual =
          number >= 5
          ? "BIG"
          : "SMALL";


        const prediction =
          randomPrediction();


        bot.history.push({

          period:
            String(row.issueNumber),

          prediction:
            prediction,

          result:
            actual +
            " (" +
            number +
            ")",

          status:
            prediction === actual
            ? "WIN"
            : "LOSS"

        });

      });


      bot.history =
        bot.history.slice(0,10);


      bot.nextPred =
        randomPrediction();

    });

}


/* ==========================================
   BOT LIST
========================================== */

function renderBotList(){

  const container =
    document.getElementById(
      "botListContainer"
    );


  let bots =
    [...botData[currentGameMode]];


  bots.sort(
    (a,b)=>
      getAccuracy(b) -
      getAccuracy(a)
  );


  container.innerHTML = "";


  bots.forEach(
    (bot,index)=>{

      const accuracy =
        getAccuracy(bot);


      const rankClass =
        index === 0
        ? "rank1"
        : index === 1
        ? "rank2"
        : index === 2
        ? "rank3"
        : "";


      const dots =
        bot.history
          .slice(0,6)
          .map(
            h => `
              <span class="dot ${
                h.status === "WIN"
                ? "dot-win"
                : "dot-loss"
              }">
                ${
                  h.status === "WIN"
                  ? "✓"
                  : "✕"
                }
              </span>
            `
          )
          .join("");


      const pred =
        bot.nextPred ||
        randomPrediction();


      const predClass =
        pred === "BIG"
        ? "pred-big"
        : "pred-small";


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "bot-card";


      card.onclick = () =>
        openBotPage(bot.id);


      card.innerHTML = `

        <div class="bot-left">

          <div class="rank ${rankClass}">
            ${index + 1}
          </div>

          <img
            class="bot-avatar"
            src="${bot.avatar}"
          >

          <div>

            <div>

              <span class="bot-name">
                ${bot.name}
              </span>

              <span class="bot-acc">
                ${accuracy}%
              </span>

            </div>

            <div class="history-dots">
              ${dots}
            </div>

          </div>

        </div>

        <div>
          <span class="pred ${predClass}">
            ${pred}
          </span>
        </div>

      `;


      container.appendChild(
        card
      );

    }
  );

}


/* ==========================================
   OPEN BOT
========================================== */

function openBotPage(id){

  activeBotId = id;


  document.getElementById(
    "mainPage"
  ).style.display = "none";


  document.getElementById(
    "botDetailPage"
  ).style.display = "block";


  renderActiveBotPage();


  window.scrollTo(
    {
      top:0,
      behavior:"smooth"
    }
  );

}


/* ==========================================
   DETAIL PAGE
========================================== */

function renderActiveBotPage(){

  if(!activeBotId)
    return;


  const bot =
    botData[currentGameMode]
      .find(
        x => x.id === activeBotId
      );


  if(!bot)
    return;


  document.getElementById(
    "activeBotAvatar"
  ).src = bot.avatar;


  document.getElementById(
    "activeBotName"
  ).innerText =
    bot.name;


  document.getElementById(
    "activeBotAcc"
  ).innerText =
    getAccuracy(bot) + "%";


  document.getElementById(
    "detailPeriodNum"
  ).innerText =
    "Period: " +
    (
      currentServerPeriod ||
      "Loading..."
    );


  const prediction =
    bot.nextPred ||
    randomPrediction();


  const predClass =
    prediction === "BIG"
    ? "pred-big"
    : "pred-small";


  document.getElementById(
    "detailPredBadge"
  ).innerHTML = `

    <span class="next-badge ${predClass}">
      ${prediction}
    </span>

  `;


  const table =
    document.getElementById(
      "betsHistoryTable"
    );


  table.innerHTML = "";


  bot.history
    .slice(0,10)
    .forEach(h=>{

      const tr =
        document.createElement(
          "tr"
        );


      const predictionBadge =
        h.prediction === "BIG"
        ? `<span class="badge-big">BIG</span>`
        : `<span class="badge-small">SMALL</span>`;


      const status =
        h.status === "WIN"
        ? `<span class="win-text">✓ Win</span>`
        : `<span class="loss-text">✕ Loss</span>`;


      tr.innerHTML = `

        <td>
          ${String(h.period).slice(-8)}
        </td>

        <td>
          ${predictionBadge}
        </td>

        <td>
          <b>${h.result}</b>
        </td>

        <td>
          ${status}
        </td>

      `;


      table.appendChild(
        tr
      );

    });

}


/* ==========================================
   BACK
========================================== */

function showListPage(){

  activeBotId = null;


  document.getElementById(
    "botDetailPage"
  ).style.display = "none";


  document.getElementById(
    "mainPage"
  ).style.display = "block";


  renderBotList();


  window.scrollTo(
    {
      top:0,
      behavior:"smooth"
    }
  );

}


/* ==========================================
   GAME MODE
========================================== */

function switchGameMode(mode){

  if(mode === currentGameMode)
    return;


  currentGameMode = mode;


  document.getElementById(
    "tab30s"
  ).classList.remove("active");


  document.getElementById(
    "tab1m"
  ).classList.remove("active");


  if(mode === "30s"){

    document.getElementById(
      "tab30s"
    ).classList.add("active");


    document.getElementById(
      "bannerGameTitle"
    ).innerText =
      "WinGo 30sec";

  }else{

    document.getElementById(
      "tab1m"
    ).classList.add("active");


    document.getElementById(
      "bannerGameTitle"
    ).innerText =
      "WinGo 1 Min";

  }


  /*
    30s aur 1m ka period alag.
  */

  currentServerPeriod =
    getSavedPeriod();


  serverHistory = [];


  fetchGameData();

}


/* ==========================================
   TIMER
========================================== */

function updateTimer(){

  const now =
    new Date();


  let remaining;


  if(
    currentGameMode === "30s"
  ){

    remaining =
      30 -
      (
        now.getSeconds() % 30
      );

  }else{

    remaining =
      60 -
      now.getSeconds();

  }


  const text =
    String(
      remaining
    ).padStart(2,"0");


  document.getElementById(
    "t1"
  ).innerText =
    text[0];


  document.getElementById(
    "t2"
  ).innerText =
    text[1];

}


/* ==========================================
   START
========================================== */

renderBotList();

fetchGameData();

updateTimer();


/*
  API ko har 3 seconds check karo.
*/
setInterval(
  fetchGameData,
  3000
);


/*
  Timer har second update.
*/
setInterval(
  updateTimer,
  1000
);

</script>
