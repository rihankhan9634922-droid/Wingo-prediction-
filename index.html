<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DAMAN Prediction</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050912;color:#fff;
 font-family:Arial,sans-serif
}
.app{max-width:1100px;margin:auto;padding:12px}

header{
 display:flex;align-items:center;justify-content:space-between;
 padding:12px 5px
}
.logo{font-size:22px;font-weight:bold}
.logo small{display:block;color:#ffb52a;font-size:11px}

nav button{
 background:none;border:1px solid #394052;color:#fff;
 padding:9px 12px;border-radius:20px;margin-left:4px
}

.modes{
 display:grid;grid-template-columns:repeat(4,1fr);
 background:#fff;border-radius:18px;overflow:hidden;margin:10px 0
}
.mode{
 border:0;background:#fff;padding:20px 5px;
 font-weight:bold;font-size:16px
}
.mode.active{
 background:linear-gradient(140deg,#ff3945,#ff6862);
 color:#fff
}

.hero{
 display:grid;grid-template-columns:1fr 1fr;
 background:linear-gradient(120deg,#f62b39,#d9101d);
 border-radius:18px;overflow:hidden
}
.hero>div{padding:25px}
.right{text-align:center;border-left:2px dashed #ffffff88}

.game{font-size:21px;font-weight:bold;margin:20px 0}

.balls{display:flex;gap:10px}
.ball{
 width:48px;height:48px;border-radius:50%;
 background:#fff;color:#ed2938;
 display:grid;place-items:center;
 font-size:20px;font-weight:bold
}
.ball.green{color:#18b96b}

.timer{font-size:50px;font-weight:bold;margin:15px 0}
.period{font-size:20px;font-weight:bold}

.main{
 display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px
}
.panel{
 background:#091321;border:1px solid #1c2b42;
 border-radius:15px;padding:14px
}
.title{font-size:20px;font-weight:bold;margin-bottom:12px}

.bot{
 display:flex;align-items:center;gap:10px;
 background:#0c1727;border:1px solid #1c2b42;
 padding:9px;border-radius:12px;margin:6px 0
}
.bot.selected{border:2px solid #f3ad16}
.avatar{
 width:42px;height:42px;border-radius:50%;
 background:#ddd;display:grid;place-items:center;font-size:24px
}
.info{flex:1}
.name{font-weight:bold}
.percent{color:#35e88b}

.profile{
 display:flex;align-items:center;gap:12px;
 border:1px solid #26354b;border-radius:12px;padding:12px
}
.profile .avatar{width:60px;height:60px;font-size:34px}
.profile-name{font-size:23px;font-weight:bold}
.accuracy{margin-left:auto;text-align:right}
.accuracy strong{display:block;font-size:28px;color:#35e88b}

.bet{
 display:grid;grid-template-columns:1.5fr .7fr .7fr .7fr;
 gap:5px;align-items:center;
 background:#0b1524;border:1px solid #1b2b41;
 border-radius:9px;padding:8px;margin:5px 0;font-size:11px
}
.num{
 width:27px;height:27px;border-radius:50%;
 border:1px solid #20c875;color:#35e88b;
 display:grid;place-items:center
}
.num.red{border-color:#f03a48;color:#ff5963}
.status{color:#36e88e}
.loss{color:#ff5963}

@media(max-width:700px){
 nav button{font-size:10px;padding:7px}
 .hero,.main{grid-template-columns:1fr}
 .right{border-left:0;border-top:2px dashed #ffffff88}
 .timer{font-size:38px}
 .mode{font-size:11px;padding:16px 2px}
}
</style>
</head>

<body>

<div class="app">

<header>
 <div class="logo">
  ♛ DAMAN
  <small>PREDICTION</small>
 </div>

 <nav>
  <button>⌂ Home</button>
  <button>◷ History</button>
  <button>▥ Stats</button>
 </nav>
</header>

<div class="modes">
 <button class="mode active" data-time="30">◷<br>WinGo 30Sec</button>
 <button class="mode" data-time="60">◷<br>WinGo 1Min</button>
 <button class="mode" data-time="180">◷<br>WinGo 3Min</button>
 <button class="mode" data-time="300">◷<br>WinGo 5Min</button>
</div>

<section class="hero">

 <div>
  <b>▣ How to play</b>
  <div class="game" id="game">WinGo 30sec</div>
  <div class="balls" id="balls">
   <span class="ball">2</span>
   <span class="ball">1</span>
   <span class="ball">4</span>
   <span class="ball green">6</span>
   <span class="ball green">7</span>
  </div>
 </div>

 <div class="right">
  <b>Time remaining</b>
  <div class="timer" id="timer">00:30</div>
  <div class="period" id="period">--</div>
 </div>

</section>

<div class="main">

<section class="panel">
 <div class="title">🏆 Bots Ranking</div>
 <div id="bots"></div>
</section>

<section class="panel">

 <div class="profile">
  <div class="avatar">👩🏻</div>
  <div>
   <div class="profile-name">Sophia</div>
   <small>Bot 1</small>
  </div>
  <div class="accuracy">
   <strong>80%</strong>Accuracy
  </div>
 </div>

 <h3>◷ Last 10 Bets</h3>
 <div id="bets"></div>

</section>

</div>
</div>

<script>
const API_URL="";

let gameTime=30;

const names=["Sophia","Daniel","Emma","Ryan","Olivia"];

function showBots(){
 document.getElementById("bots").innerHTML=names.map((n,i)=>`
 <div class="bot ${i==0?'selected':''}">
  <div>${i+1}</div>
  <div class="avatar">${i%2?'👨🏻':'👩🏻'}</div>
  <div class="info">
   <div class="name">${n}</div>
   <span class="percent">${80-i*7}% Accuracy</span>
  </div>
  <div>›</div>
 </div>`).join("");
}

function showBets(){
 document.getElementById("bets").innerHTML=
 Array.from({length:10},(_,i)=>`
 <div class="bet">
  <span>--</span>
  <span><span class="num">B</span></span>
  <span><span class="num red">S</span></span>
  <span class="status">✓ Win</span>
 </div>`).join("");
}

function clock(){
 let s=gameTime-(Math.floor(Date.now()/1000)%gameTime);
 let m=Math.floor(s/60),x=s%60;
 document.getElementById("timer").textContent=
  String(m).padStart(2,"0")+":"+String(x).padStart(2,"0");
}

document.querySelectorAll(".mode").forEach(b=>{
 b.onclick=()=>{
  document.querySelectorAll(".mode").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
  gameTime=Number(b.dataset.time);
  document.getElementById("game").textContent=
   gameTime<60?"WinGo "+gameTime+"sec":"WinGo "+gameTime/60+" Min";
  clock();
 };
});

async function loadAPI(){
 if(!API_URL)return;

 try{
  const r=await fetch(API_URL,{cache:"no-store"});
  const d=await r.json();

  if(d.current?.issueNumber)
   document.getElementById("period").textContent=d.current.issueNumber;

  if(Array.isArray(d.history)){
   document.getElementById("balls").innerHTML=
    d.history.slice(0,5).map(x=>`
     <span class="ball ${Number(x.number)>=5?'green':''}">
      ${x.number}
     </span>`).join("");
  }

 }catch(e){
  console.log("API error",e);
 }
}

showBots();
showBets();
clock();

setInterval(clock,250);
setInterval(loadAPI,1000);
loadAPI();
</script>

</body>
     </html>
